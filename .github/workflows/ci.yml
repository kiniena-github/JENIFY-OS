name: JENIFY CI

on:
  pull_request:
    # Not just [main]: the HQ work is a stack of PRs whose base is another
    # feature branch, so a main-only filter meant every "green" run on those
    # PRs had to be dispatched by hand. Run on every pull request instead.
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jenify-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      # Root `npm test` covers @factoryos/server only and root `npm run build`
      # covers shared + server + web only, so until now nothing in CI ever
      # executed or built @factoryos/headquarter. Every HQ green tick was a
      # hand-run local claim. These three steps make CI say what it means.
      - name: Run headquarter tests
        run: npm run test:hq

      - name: Typecheck headquarter
        run: npm run typecheck --workspace @factoryos/headquarter

      - name: Build headquarter site
        run: npm run build:site --workspace @factoryos/headquarter

      - name: Build all workspaces
        run: npm run build
