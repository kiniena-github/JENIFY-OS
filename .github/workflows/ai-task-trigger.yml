name: AI Task Routine Bridge

# Bridges routed GitHub AI tasks to the existing claude.ai Claude Code Routine
# "AI WORKERS" (API trigger / fire endpoint).
#
# Routing:
#   [AI TASK] ...          -> Claude only (legacy/default)
#   [AI TASK][CLAUDE] ...  -> Claude only
#   [AI TASK][BOTH] ...    -> Claude + Gemini
#   [AI TASK][GEMINI] ...  -> Gemini only (handled by ai-task-gemini.yml)
#
# Secrets:
#   CLAUDE_ROUTINE_URL
#   CLAUDE_ROUTINE_TOKEN
# Uses only the existing claude.ai Routine subscription allowance. This is
# NOT the paid Claude Platform API; never use ANTHROPIC_API_KEY here.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the Claude-routed [AI TASK] issue"
        required: true
        type: string

permissions:
  issues: read

concurrency:
  group: ai-task-bridge-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fire-routine:
    name: Fire AI WORKERS routine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       ((github.event.action == 'opened') ||
        (github.event.action == 'labeled' && github.event.label.name == 'ai-task')) &&
       startsWith(github.event.issue.title, '[AI TASK]') &&
       !startsWith(github.event.issue.title, '[AI TASK][GEMINI]'))

    steps:
      - name: Check routine secrets are configured
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::CLAUDE_ROUTINE_URL and/or CLAUDE_ROUTINE_TOKEN repository secrets are missing. Add them under Settings -> Secrets and variables -> Actions (see docs/AI_TASK_ROUTINE_TRIGGER.md). Never paste these values into issues, chat, commits, or logs."
            exit 1
          fi
          echo "Routine secrets are configured."

      - name: Skip duplicate open-time label event
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          created=$(date -d "$CREATED_AT" +%s)
          now=$(date +%s)
          age=$(( now - created ))
          if [ "$age" -lt 120 ]; then
            echo "Label added ${age}s after issue creation; the 'opened' event already fires the routine for new routed AI tasks. Skipping duplicate."
            echo "SKIP_FIRE=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve issue details (issue event)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE_IN: ${{ github.event.issue.title }}
          ISSUE_URL_IN: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER_IN: ${{ github.event.issue.number }}
        run: |
          {
            echo "ISSUE_TITLE<<JENIFY_EOF_7f3a"
            echo "$ISSUE_TITLE_IN"
            echo "JENIFY_EOF_7f3a"
            echo "ISSUE_URL=$ISSUE_URL_IN"
            echo "ISSUE_NUMBER=$ISSUE_NUMBER_IN"
          } >> "$GITHUB_ENV"

      - name: Resolve issue details (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER_IN: ${{ inputs.issue_number }}
        run: |
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER_IN")
          title=$(printf '%s' "$issue" | jq -r '.title')
          url=$(printf '%s' "$issue" | jq -r '.html_url')
          author=$(printf '%s' "$issue" | jq -r '.user.login')
          case "$title" in
            "[AI TASK][GEMINI]"*)
              echo "::error::Issue #$ISSUE_NUMBER_IN is Gemini-only; refusing to fire Claude."
              exit 1
              ;;
            "[AI TASK]"*) ;;
            *)
              echo "::error::Issue #$ISSUE_NUMBER_IN title does not start with [AI TASK]; refusing to fire the routine."
              exit 1
              ;;
          esac
          if [ "$author" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Automatic AI tasks must be created by the repository owner."
            exit 1
          fi
          {
            echo "ISSUE_TITLE<<JENIFY_EOF_7f3a"
            echo "$title"
            echo "JENIFY_EOF_7f3a"
            echo "ISSUE_URL=$url"
            echo "ISSUE_NUMBER=$ISSUE_NUMBER_IN"
          } >> "$GITHUB_ENV"

      - name: Fire AI WORKERS routine
        if: env.SKIP_FIRE != 'true'
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          text="Work the approved GitHub AI task at ${ISSUE_URL} (${GITHUB_REPOSITORY} issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}). Read that issue first and execute only what it asks under the saved AI WORKERS routine rules. If it is an analysis/review task, do not modify code unless the issue explicitly requests implementation. When finished, write a concise final report back to THE SAME GitHub issue as a comment beginning exactly with '<!-- jenify-claude-result -->' and then '## Claude Engineering / Review Report'. Include verdict, work performed or findings, tests/evidence, risks/blockers, and next action. Do not require the Founder to copy your report into another AI."
          body=$(jq -cn --arg text "$text" '{text: $text}')
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 2 --retry-delay 5 \
            -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "Routine fire HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Routine fire failed with HTTP $status (see docs/AI_TASK_ROUTINE_TRIGGER.md troubleshooting)."
            jq -r '"\(.error.type): \(.error.message)"' response.json 2>/dev/null || true
            exit 1
          fi
          session_url=$(jq -r '.claude_code_session_url // empty' response.json)
          echo "AI WORKERS routine session started for issue #${ISSUE_NUMBER}: ${session_url:-<no session url in response>}"
